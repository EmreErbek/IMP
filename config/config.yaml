# Investment Management Panel Configuration

# Data Settings
data:
  default_period: "1y"  # Options: 1d, 5d, 1mo, 3mo, 6mo, 1y, 2y, 5y, 10y, ytd, max
  default_interval: "1d"  # Options: 1m, 2m, 5m, 15m, 30m, 60m, 90m, 1h, 1d, 5d, 1wk, 1mo, 3mo
  market_suffix: ".IS"  # Borsa Istanbul suffix
  cache_enabled: true
  cache_duration_hours: 24

# Database Settings
database:
  type: "sqlite"
  path: "data/imp.db"
  echo: false  # Set to true for SQL debug logs

# Technical Indicators Default Settings
indicators:
  rsi:
    period: 14
  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9
  bollinger_bands:
    period: 20
    std_dev: 2
  moving_average:
    short_period: 20
    medium_period: 50
    long_period: 200

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file_path: "data/imp.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Portfolio Settings
portfolio:
  default_currency: "TRY"
  commission_rate: 0.001  # 0.1% commission
